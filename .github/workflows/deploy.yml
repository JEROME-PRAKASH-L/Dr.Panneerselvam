name: Validate portfolio

# The site is published via GitHub Pages "Deploy from a branch" (Settings ->
# Pages -> Source: Deploy from a branch -> main / root), which serves the
# static files at the repo root directly. The Actions GITHUB_TOKEN cannot
# create a Pages site on first use ("Resource not accessible by integration"),
# so enabling Pages is a one-time manual step in repo Settings. This workflow
# only validates the site.

on:
  push:
    branches:
      - main
      - claude/portfolio-b-corporate-Ln6Qj
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          test -f index.html
          test -f data.js
          test -f assets/portrait.webp
          node --check data.js
          echo "Static site validated."
